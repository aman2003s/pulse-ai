[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Offline-first, voice-first AI computer companion, built accessibility-first."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "openwakeword",
    "onnxruntime",
    "silero-vad",
    "sounddevice",
    "numpy",
    "kokoro",
    "faster-whisper",
    "websockets",
    "pydantic",
    "httpx"
]

[tool.setuptools.packages.find]
include = ["core*", "scripts*"]
